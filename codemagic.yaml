# Codemagic: builds the iOS app on a cloud Mac and uploads it to TestFlight.
# No Mac needed locally. Setup steps are in docs/IOS.md.
#
# Secrets live only in Codemagic (Team settings → Environment variables), never in git:
#   group "app_store_credentials"
#     APP_STORE_CONNECT_ISSUER_ID       App Store Connect → Users and Access → Integrations → Issuer ID
#     APP_STORE_CONNECT_KEY_IDENTIFIER  the API key's Key ID
#     APP_STORE_CONNECT_PRIVATE_KEY     contents of the downloaded AuthKey_XXXX.p8 (secret)
#     CERTIFICATE_PRIVATE_KEY           an RSA private key for the distribution certificate (secret)
#   group "firebase"
#     VITE_FIREBASE_API_KEY             the project's public Web API key (email sign-in links)

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials
        - firebase
      vars:
        BUNDLE_ID: com.viduralife.app
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-app
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build the web app
        script: npm run build
      - name: Copy it into the iOS project
        script: npx cap sync ios
      - name: Signing (certificate + App Store profile, created if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $((BUILD_NUMBER + 100))
      - name: Build the .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
